<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Google Play feature graphic (1024x500). Same glyphs and colors as app-icon.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(200 250) scale(4.2) translate(-54 -54)">
