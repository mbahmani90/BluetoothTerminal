<text x="40" y="36" class="h1">BluetoothTerminal — modules and layers (KMP, BLE)</text>
<text x="40" y="56" class="h1sub">Arrows point to what is depended on. Inside :feature:terminal: one package per screen, each with its own layers; screens share only the connection package.</text>
<rect x="300" y="76" width="360" height="66" rx="10" class="shell"/>
<text x="316" y="92" class="tag" fill="#374151">PLATFORM SHELL</text>
<text x="316" y="111" class="title">androidApp</text>
<text x="316" y="128" class="sub">MainActivity · BluetoothTerminalApp (initKoin)</text>
<rect x="740" y="76" width="360" height="66" rx="10" class="shell"/>
<text x="756" y="92" class="tag" fill="#374151">PLATFORM SHELL</text>
<text x="756" y="111" class="title">iosApp</text>
<text x="756" y="128" class="sub">iOSApp.swift · ContentView → MainViewController</text>
<path d="M480,142 L560,178" class="dep"/><path d="M920,142 L840,178" class="dep"/>
