<text x="316" y="215" class="title">:app</text>
<text x="316" y="234" class="sub">ui   App(): theme (light/dark) · NavHost(TerminalGraph) { terminalScreens() } · slide transitions</text>
<text x="316" y="249" class="sub">di   initKoin() · bluetoothModule: app scope (SupervisorJob + Default), BluetoothSession</text>
<text x="316" y="264" class="sub">     platformModule (expect/actual): BluetoothClient · builds the iOS framework &quot;Shared&quot;</text>
<path d="M700,270 V316" class="dep"/>
<text x="708" y="296" class="lbl">terminalScreens() + terminalFeatureModule</text>
<rect x="40" y="316" width="1320" height="508" rx="12" class="feature"/>
<text x="56" y="334" class="tag" fill="#2563eb">FEATURE · ONE USER GOAL: CONNECT AND TALK</text>
<text x="56" y="356" class="title">:feature:terminal</text>
<text x="200" y="356" class="text">Devices → Terminal → Settings · everything is internal except the two public entry points at the bottom</text>
<text x="56" y="426" class="layer" fill="#2563eb">presentation</text>
<text x="56" y="536" class="layer" fill="#059669">domain</text>
