<text x="1068" y="580" class="sub">  SetSendTarget, SetListening,</text>
<text x="1068" y="595" class="sub">  ReadCharacteristic</text>
<text x="1068" y="610" class="sub">  (on connection&#x27;s ChannelRepository)</text>
<rect x="1058" y="666" width="288" height="72" rx="6" class="none"/>
<text x="1202.0" y="706.0" class="muted" text-anchor="middle">— none: uses connection/ —</text>
<rect x="1058" y="744" width="288" height="26" rx="6" class="di"/>
<text x="1068" y="761" class="sub">settingsModule</text>
