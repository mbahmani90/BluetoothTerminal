<text x="56" y="762" class="layer" fill="#6b7280">di</text>
<rect x="170" y="370" width="288" height="32" rx="6" class="pkg"/>
<text x="180" y="386" class="pkgTitle">connection/</text>
<text x="276" y="386" class="lbl">shared by every screen · no UI</text>
<rect x="170" y="408" width="288" height="104" rx="6" class="none"/>
<text x="314.0" y="464.0" class="muted" text-anchor="middle">— none (no screen) —</text>
<rect x="170" y="518" width="288" height="142" rx="6" class="dom"/>
<text x="180" y="535" class="sub">model: ConnectionStatus, DeviceInfo,</text>
<text x="180" y="550" class="sub">  Channel (DeviceService, CharacteristicRef,</text>
<text x="180" y="565" class="sub">  ChannelSelection, IncomingData)</text>
<text x="180" y="580" class="sub">repository: ConnectionRepository,</text>
<text x="180" y="595" class="sub">  ChannelRepository</text>
<text x="180" y="610" class="sub">usecase: ObserveConnection, Disconnect</text>
<rect x="170" y="666" width="288" height="72" rx="6" class="data"/>
<text x="180" y="683" class="sub">ConnectionRepositoryImpl</text>
<text x="180" y="698" class="sub">  → BluetoothSession</text>
<text x="180" y="713" class="sub">ChannelRepositoryImpl → BluetoothSession,</text>
<text x="180" y="728" class="sub">  SerialProfiles (default pick), writeChunked</text>
<rect x="170" y="744" width="288" height="26" rx="6" class="di"/>
<text x="180" y="761" class="sub">connectionModule</text>
<rect x="466" y="370" width="288" height="32" rx="6" class="pkg"/>
<text x="476" y="386" class="pkgTitle">devices/</text>
<text x="548" y="386" class="lbl">screen 1: scan + connect</text>
