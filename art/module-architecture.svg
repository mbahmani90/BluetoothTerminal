<text x="772" y="425" class="sub">TerminalRoute / TerminalScreen</text>
<text x="772" y="440" class="sub">TerminalViewModel · TerminalUiState</text>
<text x="772" y="455" class="sub">menu: Devices, Settings, Disconnect</text>
<rect x="762" y="518" width="288" height="142" rx="6" class="dom"/>
<text x="772" y="535" class="sub">model: TerminalMessage</text>
<text x="772" y="550" class="sub">usecase: ObserveMessages, SendMessage</text>
<text x="772" y="565" class="sub">  (on connection&#x27;s ChannelRepository)</text>
<rect x="762" y="666" width="288" height="72" rx="6" class="none"/>
<text x="906.0" y="706.0" class="muted" text-anchor="middle">— none: uses connection/ —</text>
