<text x="28" y="640" class="lbl" transform="rotate(-90 28 640)">Koin: BluetoothClient, BluetoothSession</text>
<rect x="40" y="870" width="980" height="200" rx="12" class="lib"/>
<text x="56" y="888" class="tag" fill="#7c3aed">REUSABLE KMP LIBRARY · NO UI · NO DI · NO APP TYPES · COROUTINES ONLY</text>
<text x="56" y="908" class="title">:bluetooth</text>
<text x="150" y="908" class="sub">package com.majidbahmani.bluetooth · explicitApi()</text>
<text x="56" y="928" class="tag" fill="#7c3aed">commonMain</text>
