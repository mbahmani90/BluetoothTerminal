<text x="542.0" y="966.0" class="sub">SerialProfiles: NUS, HM-10,</text>
<text x="542.0" y="978.5" class="sub">  FFF0, Microchip + detect()</text>
<text x="542.0" y="991.0" class="sub">writeChunked(): split by</text>
<text x="542.0" y="1003.5" class="sub">  maxWriteLength</text>
<rect x="773.0" y="934" width="231.0" height="86" rx="6" class="src"/>
<text x="781.0" y="950" class="pkgTitle">testing/</text>
<text x="781.0" y="966.0" class="sub">FakeBluetoothClient</text>
<text x="781.0" y="978.5" class="sub">FakeBleConnection</text>
