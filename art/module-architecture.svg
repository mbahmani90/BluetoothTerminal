<text x="64.0" y="978.5" class="sub">  scan, connect)</text>
<text x="64.0" y="991.0" class="sub">BleConnection (one link: read,</text>
<text x="64.0" y="1003.5" class="sub">  write, observe, disconnect)</text>
<text x="64.0" y="1016.0" class="sub">BluetoothSession (current link)</text>
<rect x="295.0" y="934" width="231.0" height="86" rx="6" class="src"/>
<text x="303.0" y="950" class="pkgTitle">model/</text>
<text x="303.0" y="966.0" class="sub">BleDevice · Gatt · ScanFilter</text>
<text x="303.0" y="978.5" class="sub">AdapterState · ConnectionState</text>
<text x="303.0" y="991.0" class="sub">SessionState (Idle, Connecting,</text>
<text x="303.0" y="1003.5" class="sub">  Connected, Failed, Lost)</text>
<text x="303.0" y="1016.0" class="sub">BluetoothException (sealed)</text>
<rect x="534.0" y="934" width="231.0" height="86" rx="6" class="src"/>
