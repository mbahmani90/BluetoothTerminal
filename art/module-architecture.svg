<text x="540" y="1220" class="sub" text-anchor="middle">HM-10 · Nordic UART · ESP32 · BLE OBD-II dongle</text>
<path d="M293,1138 L420,1180" class="radio"/>
<rect x="1060" y="960" width="300" height="112" rx="8" class="legend"/>
<text x="1074" y="978" class="noteTitle" fill="#374151">Layers</text>
<rect x="1074" y="988" width="14" height="12" rx="2" class="pres"/>
<text x="1094" y="998" class="lbl" font-weight="700">presentation</text>
<text x="1170" y="998" class="lbl">Route, Screen, ViewModel, UiState</text>
<rect x="1074" y="1008" width="14" height="12" rx="2" class="dom"/>
<text x="1094" y="1018" class="lbl" font-weight="700">domain</text>
<text x="1170" y="1018" class="lbl">models, repository interfaces, use cases</text>
<rect x="1074" y="1028" width="14" height="12" rx="2" class="data"/>
<text x="1094" y="1038" class="lbl" font-weight="700">data</text>
<text x="1170" y="1038" class="lbl">repository impls (only :bluetooth users)</text>
<rect x="1074" y="1048" width="14" height="12" rx="2" class="di"/>
<text x="1094" y="1058" class="lbl" font-weight="700">di</text>
<text x="1170" y="1058" class="lbl">internal Koin module per package</text>
<rect x="1060" y="1086" width="300" height="150" rx="8" class="note"/>
<text x="1074" y="1104" class="noteTitle">Rules</text>
<text x="1074" y="1122" class="text">• Shells only start the app</text>
<text x="1074" y="1137" class="text">• :app is the only module that knows all</text>
<text x="1074" y="1152" class="text">• One feature module per user goal,</text>
<text x="1074" y="1167" class="text">   one package per screen</text>
<text x="1074" y="1182" class="text">• Screen packages never import each other;</text>
<text x="1074" y="1197" class="text">   they share only connection/</text>
<text x="1074" y="1212" class="text">• domain is pure Kotlin: no :bluetooth types</text>
<text x="1074" y="1227" class="text">• :bluetooth has no app types and no DI</text>
</svg>